<section class="page-shell">
  <div class="page-header">

    <div>
      <h2>Gestión de usuarios</h2>
    </div>

    <p-button
      icon="pi pi-plus"
      label="Nuevo usuario"
      styleClass="text-xl"
      (onClick)="createUser()">
    </p-button>
  </div>

  <app-table-generic
    [title]="'Listado'"
    [data]="users"
    [columns]="columns"
    [actions]="actions"
    formWidth="full"
    fontSize="md"
    emptyMessage="No hay usuarios creados"
    (onView)="viewUser($event)"
    (onEdit)="editUser($event)"
    (onDelete)="deleteUser($event)">
  </app-table-generic>

</section>
