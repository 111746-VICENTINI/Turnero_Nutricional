app.name='@project.name@'
app.desc='@project.description@'
app.version='@project.version@'
app.url=http://localhost:8080
app.dev-name=111746
app.dev-email=dumy@dumy
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/consultorio?serverTimezone=UTC
spring.datasource.username=admin
spring.datasource.password=123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Argentina/Buenos_Aires

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Data loading
#spring.sql.init.mode=always
#spring.sql.init.data-locations=classpath:data.sql
#spring.sql.init.continue-on-error=false

# JWT configuration
jwt.secret=${JWT_SECRET:ChangeThisSecretKeyAtLeast32Chars}
#24hs
jwt.expiration=86400000

# WhatsApp Business Cloud API
whatsapp.cloud-api.base-url=https://graph.facebook.com
whatsapp.cloud-api.api-version=${WHATSAPP_API_VERSION:v20.0}
whatsapp.cloud-api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.cloud-api.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.cloud-api.verify-token=${WHATSAPP_VERIFY_TOKEN:}
whatsapp.cloud-api.appointment-created-template=${WHATSAPP_APPOINTMENT_CREATED_TEMPLATE:appointment_created}
whatsapp.cloud-api.appointment-reminder-template=${WHATSAPP_APPOINTMENT_REMINDER_TEMPLATE:appointment_reminder}
whatsapp.cloud-api.template-language=${WHATSAPP_TEMPLATE_LANGUAGE:es_AR}
whatsapp.cloud-api.consultorio-address=${CONSULTORIO_ADDRESS:}
whatsapp.cloud-api.consultorio-phone=${CONSULTORIO_PHONE:}
whatsapp.cloud-api.appointment-cost=${CONSULTORIO_APPOINTMENT_COST:}
whatsapp.cloud-api.connect-timeout=5s
whatsapp.cloud-api.read-timeout=10s

# Appointment reminders
appointment.reminder.enabled=${APPOINTMENT_REMINDER_ENABLED:true}
appointment.reminder.hours-before=${APPOINTMENT_REMINDER_HOURS_BEFORE:24}
appointment.reminder.look-ahead-days=${APPOINTMENT_REMINDER_LOOK_AHEAD_DAYS:7}
appointment.reminder.business-days=${APPOINTMENT_REMINDER_BUSINESS_DAYS:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY}
appointment.reminder.cron=${APPOINTMENT_REMINDER_CRON:0 0 * * * *}
