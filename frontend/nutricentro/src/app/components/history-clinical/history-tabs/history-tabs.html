<div class="clinical-tabs">
  <p-tabs [value]="activeTab">
    <p-tablist>
      <p-tab value="summary" (click)="selectTab('summary')"><i class="pi pi-id-card"></i> Resumen</p-tab>
      <p-tab value="consultations" (click)="selectTab('consultations')"><i class="pi pi-history"></i> Controles</p-tab>
      <p-tab value="anthropometry" (click)="selectTab('anthropometry')"><i class="pi pi-chart-line"></i> Antropometria</p-tab>
      <p-tab value="laboratory" (click)="selectTab('laboratory')"><i class="pi pi-chart-bar"></i> Laboratorio</p-tab>
      <p-tab value="settings" (click)="selectTab('settings')"><i class="pi pi-sitemap"></i> Antecedentes</p-tab>
      <p-tab value="nutrition" (click)="selectTab('nutrition')"><i class="pi pi-apple"></i> Nutricion</p-tab>
      <p-tab value="plans" (click)="selectTab('plans')"><i class="pi pi-list-check"></i> Plan Alimentario</p-tab>
      <p-tab value="files" (click)="selectTab('files')"><i class="pi pi-folder-open"></i> Archivos</p-tab>
    </p-tablist>

    <p-tabpanels>
      <p-tabpanel value="summary">
        <app-tab-patient-summary
          [nutritionData]="nutritionData"
          [history]="history">
        </app-tab-patient-summary>
      </p-tabpanel>

      <p-tabpanel value="consultations">
        <app-tab-consultations
          [history]="history"
          (saved)="notifyChange()">
        </app-tab-consultations>
      </p-tabpanel>

      <p-tabpanel value="anthropometry">
        <app-tab-anthropometry
          [history]="history"
          (saved)="notifyChange()">
        </app-tab-anthropometry>
      </p-tabpanel>

      <p-tabpanel value="laboratory">
        <app-tab-laboratory
          [history]="history"
          (saved)="notifyChange()">
        </app-tab-laboratory>
      </p-tabpanel>

      <p-tabpanel value="nutrition">
        <app-tab-nutritional-data
          [history]="history"
          (saved)="notifyChange()">
        </app-tab-nutritional-data>
      </p-tabpanel>

      <p-tabpanel value="plans">
        <app-tab-plans
          [history]="history"
          (saved)="notifyChange()">
        </app-tab-plans>
      </p-tabpanel>

      <p-tabpanel value="files">
        <app-tab-files
          [history]="history"
          (saved)="notifyChange()">
        </app-tab-files>
      </p-tabpanel>

      <p-tabpanel value="settings">
        <app-tab-clinical-data
          [history]="history"
          (saved)="notifyChange()">
        </app-tab-clinical-data>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
