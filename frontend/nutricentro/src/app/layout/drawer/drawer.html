<p-confirmDialog></p-confirmDialog>

<div class="app-shell">
  <aside
    class="sidebar"
    [class.expanded]="sidebarExpanded"
    [class.hidden-sidebar]="!sidebarVisible"
    (mouseenter)="sidebarExpanded = true"
    (mouseleave)="sidebarExpanded = false"
    aria-label="Navegación principal"
  >
    <nav class="menu-panel">
      <ul class="menu-list">
        @for (item of visibleNavigationItems; track item.route) {
          <li>
            <a
              pRipple
              [routerLink]="item.route"
              routerLinkActive="menu-active"
              [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' || item.route === '/agenda' || item.route === '/mi-dia' || item.route === '/patient' || item.route === '/professional' || item.route === '/users' || item.route === '/specialty' }"
              class="menu-item"
              [attr.aria-label]="item.label"
            >
              <i [class]="item.icon"></i>
              @if (sidebarExpanded) {
                <span>{{ item.label }}</span>
              }
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="logout-panel">
      <button pRipple type="button" (click)="logout()" class="menu-item logout-item" aria-label="Cerrar sesión">
        <i class="pi pi-sign-out"></i>
        @if (sidebarExpanded) {
          <span>Cerrar sesión</span>
        }
      </button>
    </div>
  </aside>

  <div class="content-wrapper" [class.wrapper-full]="!sidebarVisible">
    <header class="topbar">
      <div class="topbar-left">
        <p-button
          icon="pi pi-bars"
          [text]="true"
          (onClick)="toggleSidebar()"
          styleClass="topbar-menu-button"
          ariaLabel="Mostrar/ocultar menú">
        </p-button>

        <div class="topbar-heading">
          <span class="topbar-brand">Nutri Centro</span>
          <span class="topbar-section">{{ currentSection }}</span>
        </div>
      </div>

      <div class="topbar-right">
        @if (canSeeNotifications) {
          <button
            pRipple
            type="button"
            class="notification-trigger"
            [class.has-unread]="unreadNotificationsCount > 0"
            (click)="toggleNotifications($event, notificationPopover)"
            aria-label="Notificaciones">
            <i class="pi pi-bell"></i>
            @if (unreadNotificationsCount > 0) {
              <span class="notification-count">{{ notificationBadgeLabel }}</span>
            }
          </button>

          <p-popover #notificationPopover styleClass="notifications-popover">
            <app-notifications-panel
              [notifications]="notifications"
              [loading]="notificationsLoading"
              [unreadCount]="unreadNotificationsCount"
              (markAllAsRead)="markAllAsRead()"
              (markAsRead)="markAsRead($event)"
              (openPatient)="openPatient($event, notificationPopover)">
            </app-notifications-panel>
          </p-popover>
        }
        <span class="username">{{ getFullName() }}</span>
        <i class="pi pi-user"></i>
      </div>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
