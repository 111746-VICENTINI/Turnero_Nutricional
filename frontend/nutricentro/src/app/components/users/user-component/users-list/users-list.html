<p-table
  [value]="users">

  <ng-template pTemplate="header">
    <tr>
      <th>Usuario</th>
      <th>Email</th>
      <th>Activo</th>
      <th>Roles</th>
      <th>Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-user>
    <tr>
      <td>
        {{ user.username }}
      </td>

      <td>
        {{ user.email }}
      </td>

      <td>
        {{ user.isActive ? 'Sí' : 'No' }}
      </td>

      <td>
        {{ user.roles.join(', ') }}
      </td>

      <td>
        <p-button
          icon="pi pi-pencil"
          severity="info"
          [text]="true"
          (onClick)="editUser(user)">
        </p-button>

        <p-button
          icon="pi pi-trash"
          severity="danger"
          [text]="true"
          (onClick)="deleteUser(user)">
        </p-button>
      </td>
    </tr>
  </ng-template>
</p-table>
