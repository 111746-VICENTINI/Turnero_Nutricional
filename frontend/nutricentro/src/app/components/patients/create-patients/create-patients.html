<p-toast></p-toast>

<section class="page-shell">
  <header class="page-header">
    <h1>{{ pageTitle}}</h1>

    @if (mode === 'view') {
      <div class="header-actions">
        <p-button
          label="Historial Clínico"
          icon="pi pi-book"
          severity="info"
          (onClick)="goToHistory()">
        </p-button>

        <p-button
          icon="pi pi-pencil"
          label="Editar"
          (onClick)="editModePatient()">
        </p-button>
      </div>
    }
  </header>

  <app-form-generic
    [fields]="fields"
    [initialValues]="initialValues"
    [isSubmitting]="saving"
    [columnsPerRow]="2"
    [readonly]="!isFormEditable"
    [showActions]="mode !== 'view'"
    [showCancel]="mode === 'edit' || mode === 'create'"
    formWidth="full"
    fontSize="md"
    submitLabel="{{ submitLabel }}"
    cancelLabel="Cancelar"
    (formSubmit)="savePatient($event)"
    (formCancel)="cancel()"
  >
  </app-form-generic>

  <!-- volver atras -->
  <div class="page-footer">
    <p-button
      icon="pi pi-arrow-left"
      label="Volver"
      severity="secondary"
      [outlined]="true"
      (onClick)="goBack()">
    </p-button>
  </div>
</section>
