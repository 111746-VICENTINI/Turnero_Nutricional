<section class="page-shell">
  <p-toast></p-toast>

  <div class="page-header">

    <div>
      <h2>Gestión de usuarios</h2>
    </div>

    <p-button
      icon="pi pi-plus"
      label="Nuevo usuario"
      styleClass="text-xl"
      (onClick)="createUser()">
    </p-button>
  </div>

  <app-table-generic
    [title]="'Listado'"
    [data]="users"
    [columns]="columns"
    [actions]="actions"
    [filterConfigs]="filterConfigs"
    [totalRecords]="totalRecords"
    [lazy]="true"
    formWidth="full"
    fontSize="md"
    emptyMessage="No hay usuarios creados"
    (onView)="viewUser($event)"
    (onEdit)="editUser($event)"
    (onDelete)="deleteUser($event)"
    (onActionClick)="handleAction($event)"
    (tableStateChange)="onTableChange($event)"
  >
  </app-table-generic>

</section>
